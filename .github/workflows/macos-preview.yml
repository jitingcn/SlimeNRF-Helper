name: macOS preview

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preview:
    name: macOS ${{ matrix.arch }} / no firmware
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            machine: arm64
          # Standard native Intel runner; see actions/runner-images#13739.
          - runner: macos-26-intel
            arch: x64
            machine: x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select native Apple SDK and repository-pinned Rust
        env:
          PREVIEW_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$PREVIEW_MACHINE"
          rustc --version --verbose
          cargo --version
          xcrun --sdk macosx --show-sdk-version
          cmake --version
          deployment="$(plutil -extract LSMinimumSystemVersion raw -expect string scripts/macos/Info.plist)"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          printf 'MACOSX_DEPLOYMENT_TARGET=%s\nSDKROOT=%s\n' "$deployment" "$sdk" >> "$GITHUB_ENV"

      - name: Install checksum-pinned universal cargo-nextest
        run: |
          archive="$RUNNER_TEMP/cargo-nextest-0.9.152-universal-apple-darwin.tar.gz"
          tools="$RUNNER_TEMP/cargo-nextest-0.9.152"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-universal-apple-darwin.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '2fadf57df4243e691f088ee3bff4f4ab9af16da0c95a1db84b5cb1685e098a76' "$archive" | shasum -a 256 -c -
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" cargo-nextest
          test -x "$tools/cargo-nextest"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Check formatting, strict workspace Clippy, tests and doctests
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          # Reclaim this job's quality build before restoring Release artifacts.
          CARGO_TARGET_DIR="$(mktemp -d "$RUNNER_TEMP/slimenrf-quality.XXXXXXXX")"
          export CARGO_TARGET_DIR
          trap 'rm -rf -- "$CARGO_TARGET_DIR"' EXIT
          bash ./quality.sh --no-firmware
          cargo nextest run --locked -p slimenrf-tools

      - name: Cache Release packaging dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          key: macos-preview-${{ matrix.arch }}
          cache-bin: false

      - name: Build, sign and verify the no-firmware DMG
        id: package
        env:
          PREVIEW_ARCH: ${{ matrix.arch }}
        run: |
          image="$(bash scripts/package-macos.sh "$PREVIEW_ARCH")"
          printf 'path=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Upload preview DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
