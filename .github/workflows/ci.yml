name: Native no-firmware CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  source:
    name: Source hygiene and license notices
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository-pinned Rust toolchain
        run: |
          # Rustup reads rust-toolchain.toml and installs its profile/components.
          rustc --version --verbose
          cargo --version

      - name: Install checksum-pinned cargo-nextest
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest-0.9.152.tar.gz"
          tools="$RUNNER_TEMP/cargo-nextest-0.9.152"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 'd039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a' "$archive" | sha256sum --check -
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" cargo-nextest
          test -x "$tools/cargo-nextest"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Cache source tool dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          # Preserve the existing source-job prefix and share it with publication.
          shared-key: ubuntu-24.04-x64-tools-source
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test source tools without building the application
        run: cargo nextest run --locked -p slimenrf-tools

      - name: Check publication boundaries and frozen notices
        run: |
          cargo run --quiet --locked -p slimenrf-tools -- check-public
          cargo run --quiet --locked -p slimenrf-tools -- notices --check

  windows:
    name: Windows x64 / no firmware
    needs: source
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository-pinned Rust toolchain
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Rustup reads rust-toolchain.toml and installs its profile/components.
          rustc --version --verbose
          cargo --version
          rustup target add x86_64-pc-windows-msvc
          # windows-2022 supplies VS 2022 C++, Windows SDK, CMake and LLVM.
          # Existing entrypoints initialize VS, CMake and static CRT settings.
          if (-not (Test-Path -LiteralPath 'C:\Program Files\LLVM\bin\libclang.dll' -PathType Leaf)) {
            throw 'The Windows runner must provide LLVM/libclang.'
          }

      - name: Install checksum-pinned cargo-nextest
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'cargo-nextest-0.9.152.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'cargo-nextest-0.9.152'
          Invoke-WebRequest -Uri 'https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'cc6bf4b6a7ac18e462cd6c9bae67e26921b888249c2988c6acabf3df387ed9d6') {
            throw 'cargo-nextest archive SHA-256 mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          if (-not (Test-Path -LiteralPath (Join-Path $tools 'cargo-nextest.exe') -PathType Leaf)) {
            throw 'cargo-nextest executable is missing from the archive.'
          }
          $tools >> $env:GITHUB_PATH

      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          key: windows-2022-x64-no-firmware
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test source tools on Windows
        run: |
          . ./scripts/environment.ps1
          Initialize-SlimeNRFBuildEnvironment
          cargo nextest run --locked -p slimenrf-tools --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check formatting, strict workspace Clippy, tests and doctests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./quality.ps1 -NoFirmware

      - name: Package uncompressed Release executable
        env:
          OFFICIAL_RELEASE_TAG: ${{ github.repository == 'jitingcn/SlimeNRF-Helper' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !github.event.deleted && github.ref_name || '' }}
        run: |
          if ($env:OFFICIAL_RELEASE_TAG) {
            powershell -NoProfile -ExecutionPolicy Bypass -File ./package.ps1 -NoFirmware -OfficialReleaseTag $env:OFFICIAL_RELEASE_TAG
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File ./package.ps1 -NoFirmware
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select sole no-firmware executable
        id: normal
        run: |
          $packages = @(Get-ChildItem -Path './dist/slimenrf-helper-*-windows-x64-no-firmware.exe' -File)
          if ($packages.Count -ne 1) { throw "Expected one no-firmware EXE, found $($packages.Count)." }
          "path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows executable only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.normal.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14


  linux:
    name: Linux ${{ matrix.arch }} / no firmware
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            machine: x86_64
            nextest_sha256: d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a
          - arch: arm64
            runner: ubuntu-22.04-arm
            machine: aarch64
            nextest_sha256: ca1f81a5b86533eb45ab97e0064aa88e925e53aab9a698ca6331a7cad1f85f07
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev cmake pkg-config \
            libudev-dev libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan1 \
            curl desktop-file-utils file

      - name: Install repository-pinned Rust toolchain
        run: |
          # Rustup reads rust-toolchain.toml and installs its profile/components.
          rustc --version --verbose
          cargo --version

      - name: Install checksum-pinned cargo-nextest
        env:
          NATIVE_MACHINE: ${{ matrix.machine }}
          NEXTEST_SHA256: ${{ matrix.nextest_sha256 }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$NATIVE_MACHINE"
          archive="$RUNNER_TEMP/cargo-nextest-0.9.152.tar.gz"
          tools="$RUNNER_TEMP/cargo-nextest-0.9.152"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-${NATIVE_MACHINE}-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$NEXTEST_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" cargo-nextest
          test -x "$tools/cargo-nextest"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          key: ubuntu-22.04-${{ matrix.arch }}-no-firmware
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting, strict workspace Clippy, tests and doctests
        run: bash ./quality.sh --no-firmware

      - name: Download checksum-pinned AppImage tools
        env:
          NATIVE_MACHINE: ${{ matrix.machine }}
        run: |
          # Exact releases and cache layout from the AppImage packager.
          # The packager verifies SHA-256 before executing either tool and uses
          # appimagetool's embedded runtime, not a mutable runtime download.
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/slimenrf-helper/appimage-tools"
          mkdir -p "$tools/1-alpha-20251107-1" "$tools/1.9.1"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${NATIVE_MACHINE}.AppImage" \
            --output "$tools/1-alpha-20251107-1/linuxdeploy-${NATIVE_MACHINE}.AppImage"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${NATIVE_MACHINE}.AppImage" \
            --output "$tools/1.9.1/appimagetool-${NATIVE_MACHINE}.AppImage"

      - name: Package Release AppImage
        run: bash ./package.sh --format appimage --no-firmware

      - name: Select sole executable no-firmware AppImage
        id: linux_package
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          packages=(dist/slimenrf-helper-*-linux-"$PACKAGE_ARCH"-no-firmware.AppImage)
          if (( ${#packages[@]} != 1 )); then
            printf 'Expected one no-firmware AppImage, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi
          executable="${packages[0]}"
          [[ -f "$executable" && ! -L "$executable" && -x "$executable" ]]
          printf 'path=%s\n' "$executable" >> "$GITHUB_OUTPUT"

      - name: Upload Linux AppImage only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.linux_package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} / no firmware
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            machine: arm64
          # Standard native Intel runner; see actions/runner-images#13739.
          - runner: macos-26-intel
            arch: x64
            machine: x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select native Apple SDK and repository-pinned Rust
        env:
          NATIVE_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$NATIVE_MACHINE"
          rustc --version --verbose
          cargo --version
          xcrun --sdk macosx --show-sdk-version
          cmake --version
          deployment="$(plutil -extract LSMinimumSystemVersion raw -expect string scripts/macos/Info.plist)"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          printf 'MACOSX_DEPLOYMENT_TARGET=%s\nSDKROOT=%s\n' "$deployment" "$sdk" >> "$GITHUB_ENV"

      - name: Install checksum-pinned universal cargo-nextest
        run: |
          archive="$RUNNER_TEMP/cargo-nextest-0.9.152-universal-apple-darwin.tar.gz"
          tools="$RUNNER_TEMP/cargo-nextest-0.9.152"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-universal-apple-darwin.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '2fadf57df4243e691f088ee3bff4f4ab9af16da0c95a1db84b5cb1685e098a76' "$archive" | shasum -a 256 -c -
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" cargo-nextest
          test -x "$tools/cargo-nextest"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"

      - name: Cache native check and DMG dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          key: macos-26-${{ matrix.arch }}-no-firmware-check-and-package
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting, strict workspace Clippy, tests and doctests
        run: |
          bash ./quality.sh --no-firmware
          cargo nextest run --locked -p slimenrf-tools

      - name: Build, sign and verify the no-firmware DMG
        id: package
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          image="$(bash scripts/package-macos.sh "$PACKAGE_ARCH")"
          printf 'path=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Upload macOS DMG only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    needs: [source, windows, linux, macos]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the exact tag event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install repository-pinned Rust toolchain
        run: |
          # Rustup reads rust-toolchain.toml and installs its profile/components.
          rustc --version --verbose
          cargo --version

      - name: Cache source tool dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          # Match the source job instead of adding a separate release job key.
          shared-key: ubuntu-24.04-x64-tools-source
          cache-bin: false
          save-if: false

      - name: Prepare exact-version changelog notes
        id: release
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          version="$(cargo run --quiet --locked -p slimenrf-tools -- prepare-release \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --notes-output "$RUNNER_TEMP/release-notes.md")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Named downloads use this run's artifact service, including v7 archive:false files.
      # No cross-run API token or actions:read permission is needed.
      - name: Download exact Windows executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slimenrf-helper-${{ steps.release.outputs.version }}-windows-x64-no-firmware.exe
          path: ${{ runner.temp }}/release-assets

      - name: Download exact Linux x64 AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slimenrf-helper-${{ steps.release.outputs.version }}-linux-x64-no-firmware.AppImage
          path: ${{ runner.temp }}/release-assets

      - name: Download exact Linux ARM64 AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slimenrf-helper-${{ steps.release.outputs.version }}-linux-arm64-no-firmware.AppImage
          path: ${{ runner.temp }}/release-assets

      - name: Download exact Apple Silicon DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slimenrf-helper-${{ steps.release.outputs.version }}-macos-arm64-no-firmware.dmg
          path: ${{ runner.temp }}/release-assets

      - name: Download exact Intel Mac DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slimenrf-helper-${{ steps.release.outputs.version }}-macos-x64-no-firmware.dmg
          path: ${{ runner.temp }}/release-assets

      - name: Validate release inputs and refuse existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == "v$VERSION" && "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          notes="$RUNNER_TEMP/release-notes.md"
          [[ -f "$notes" && ! -L "$notes" && -s "$notes" ]]
          assets=(
            "$RUNNER_TEMP/release-assets/slimenrf-helper-${VERSION}-windows-x64-no-firmware.exe"
            "$RUNNER_TEMP/release-assets/slimenrf-helper-${VERSION}-linux-x64-no-firmware.AppImage"
            "$RUNNER_TEMP/release-assets/slimenrf-helper-${VERSION}-linux-arm64-no-firmware.AppImage"
            "$RUNNER_TEMP/release-assets/slimenrf-helper-${VERSION}-macos-arm64-no-firmware.dmg"
            "$RUNNER_TEMP/release-assets/slimenrf-helper-${VERSION}-macos-x64-no-firmware.dmg"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || -L "$asset" || ! -s "$asset" ]]; then
              printf 'Missing, empty or nonregular release asset: %s\n' "$asset" >&2
              exit 1
            fi
          done
          # The explicit tag namespace also resolves annotated tags to their commit.
          tag_commit="$(gh api "repos/$GH_REPO/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            printf 'Remote tag %s no longer points to event commit %s.\n' "$RELEASE_TAG" "$GITHUB_SHA" >&2
            exit 1
          fi
          # A failed API call is never interpreted as absence; include drafts and all pages.
          releases="$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")"
          existing_count="$(jq --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)] | length' <<< "$releases")"
          if [[ "$existing_count" != 0 ]]; then
            printf 'Refusing to modify an existing release (including drafts) for %s.\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create draft release and upload assets
        id: upload_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: SlimeNRF Helper ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: true
          prerelease: false
          make_latest: 'false'
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release-assets/slimenrf-helper-${{ steps.release.outputs.version }}-windows-x64-no-firmware.exe
            ${{ runner.temp }}/release-assets/slimenrf-helper-${{ steps.release.outputs.version }}-linux-x64-no-firmware.AppImage
            ${{ runner.temp }}/release-assets/slimenrf-helper-${{ steps.release.outputs.version }}-linux-arm64-no-firmware.AppImage
            ${{ runner.temp }}/release-assets/slimenrf-helper-${{ steps.release.outputs.version }}-macos-arm64-no-firmware.dmg
            ${{ runner.temp }}/release-assets/slimenrf-helper-${{ steps.release.outputs.version }}-macos-x64-no-firmware.dmg

      - name: Verify uploaded draft and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ID: ${{ steps.upload_release.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          assets=(
            "$RUNNER_TEMP/release-assets/slimenrf-helper-${VERSION}-windows-x64-no-firmware.exe"
            "$RUNNER_TEMP/release-assets/slimenrf-helper-${VERSION}-linux-x64-no-firmware.AppImage"
            "$RUNNER_TEMP/release-assets/slimenrf-helper-${VERSION}-linux-arm64-no-firmware.AppImage"
            "$RUNNER_TEMP/release-assets/slimenrf-helper-${VERSION}-macos-arm64-no-firmware.dmg"
            "$RUNNER_TEMP/release-assets/slimenrf-helper-${VERSION}-macos-x64-no-firmware.dmg"
          )
          expected_assets='[]'
          for asset in "${assets[@]}"; do
            [[ -f "$asset" && ! -L "$asset" && -s "$asset" ]]
            size="$(stat --format=%s -- "$asset")"
            expected_assets="$(jq --arg name "${asset##*/}" --argjson size "$size" \
              '. + [{name: $name, size: $size}]' <<< "$expected_assets")"
          done
          release="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$GITHUB_SHA" \
            --argjson expected "$expected_assets" '
            .draft == true and .prerelease == false and
            .tag_name == $tag and .target_commitish == $commit and
            ((.assets | map({name, size}) | sort_by(.name)) ==
              ($expected | sort_by(.name))) and
            all(.assets[]; .state == "uploaded" and .size > 0)
            ' <<< "$release"
          tag_commit="$(gh api "repos/$GH_REPO/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            printf 'Remote tag %s no longer points to event commit %s.\n' "$RELEASE_TAG" "$GITHUB_SHA" >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=legacy
