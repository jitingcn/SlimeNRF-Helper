[workspace]
members = [
    "crates/app",
    "crates/firmware-image",
    "crates/recording",
    "crates/terminal-core",
    "crates/tools",
]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.dev]
# Keep edit/run builds incremental; reserve whole-program optimization for release.
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = "off"

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
strip = "symbols"
